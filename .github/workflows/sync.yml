name: sync
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      new: ${{ steps.s.outputs.new }}
    steps:
      - id: s
        env:
          T: ${{ github.token }}
          R: ${{ github.event.repository.name }}
        run: |
          git clone --bare https://x-access-token:$T@github.com/mytonprovider/$R r && cd r
          git fetch https://github.com/xssnick/$R master --tags
          git push origin FETCH_HEAD:refs/heads/master
          new=$(comm -23 <(git tag -l 'v*' | sort) <(git branch -l 'v*' --format='%(refname:short)' | sort) | jq -Rnc '[inputs]')
          git push origin $(git tag -l 'v*' | sed 's#.*#refs/tags/&^{commit}:refs/heads/&#')
          echo "new=$new" >> "$GITHUB_OUTPUT"
  image:
    needs: sync
    if: needs.sync.outputs.new != '[]'
    strategy:
      matrix:
        version: ${{ fromJSON(needs.sync.outputs.new) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ matrix.version }}
