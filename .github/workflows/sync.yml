name: sync
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ github.token }}
          R: ${{ github.event.repository.name }}
        run: |
          git clone --bare https://x-access-token:$T@github.com/mytonprovider/$R r && cd r
          git fetch https://github.com/xssnick/$R master --tags
          git push origin FETCH_HEAD:refs/heads/master
          git push origin $(git tag -l 'v*' | sed 's#.*#refs/tags/&^{commit}:refs/heads/&#')
